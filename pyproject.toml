[build-system]
requires = ["setuptools>=45", "wheel", "setuptools_scm[toml]>=6.2"]
build-backend = "setuptools.build_meta"

[project]
name = "analyse-quantitative-serie-financiere"
version = "1.0.0"
description = "Pipeline complet d'analyse quantitative et prévision de séries temporelles financières avec 12 ans de données"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "Minyurano", email = "contact@minyurano.com"}
]
keywords = [
    "finance",
    "time-series",
    "machine-learning",
    "deep-learning",
    "stock-analysis",
    "quantitative-analysis",
    "ARIMA",
    "LSTM",
    "technical-indicators",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: English",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Office/Business :: Financial",
    "Topic :: Scientific/Engineering",
]

dependencies = [
    "pandas>=1.3.0",
    "numpy>=1.20.0",
    "scipy>=1.7.0",
    "scikit-learn>=0.24.0",
    "statsmodels>=0.12.0",
    "matplotlib>=3.3.0",
    "seaborn>=0.11.0",
]

[project.optional-dependencies]
ml = [
    "xgboost>=1.4.0",
    "lightgbm>=3.2.0",
]
dl = [
    "tensorflow>=2.6.0",
    "keras>=2.4.0",
]
viz = [
    "plotly>=5.0.0",
    "plotly-express>=0.4.0",
    "bokeh>=2.3.0",
    "dash>=2.0.0",
]
dev = [
    "black>=21.0",
    "flake8>=3.9.0",
    "pylint>=2.8.0",
    "isort>=5.9.0",
    "pytest>=6.0.0",
    "pytest-cov>=2.12.0",
]
all = [
    "xgboost>=1.4.0",
    "lightgbm>=3.2.0",
    "tensorflow>=2.6.0",
    "keras>=2.4.0",
    "plotly>=5.0.0",
    "plotly-express>=0.4.0",
    "bokeh>=2.3.0",
    "dash>=2.0.0",
    "black>=21.0",
    "flake8>=3.9.0",
    "pylint>=2.8.0",
    "isort>=5.9.0",
    "pytest>=6.0.0",
    "pytest-cov>=2.12.0",
]

[project.urls]
Homepage = "https://github.com/Minyurano/Analyse-quantitative-d-une-action-boursi-re"
Documentation = "https://github.com/Minyurano/Analyse-quantitative-d-une-action-boursi-re"
Repository = "https://github.com/Minyurano/Analyse-quantitative-d-une-action-boursi-re.git"
"Bug Tracker" = "https://github.com/Minyurano/Analyse-quantitative-d-une-action-boursi-re/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.black]
line-length = 100
target-version = ['py38', 'py39', 'py310', 'py311']

[tool.isort]
profile = "black"
line_length = 100

[tool.pytest.ini_options]
addopts = "-v --strict-markers --tb=short"
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.coverage.run]
source = ["src"]
omit = [
    "*/tests/*",
    "*/__init__.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
