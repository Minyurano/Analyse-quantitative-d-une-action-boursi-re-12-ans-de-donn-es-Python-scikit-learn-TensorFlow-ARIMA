name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  analyse:
    name: Exécution de l'analyse (sans LSTM)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Installer les dépendances
        run: pip install pandas numpy scipy statsmodels scikit-learn matplotlib seaborn jinja2
      - name: Lancer le pipeline complet (sections 1 à 10)
        env:
          SKIP_LSTM: "1"
        run: python src/analyse_gold.py
      - name: Vérifier les graphiques générés
        run: test "$(ls outputs/fig_*.png | wc -l)" -eq 10
